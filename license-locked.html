<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الترخيص غير مفعّل - فَصلي</title>
  <meta name="description" content="الحساب معطّل أو الترخيص منتهي - نظام فَصلي">
  <link rel="icon" type="image/svg+xml" href="assets/logo-icon.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B1C33">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo:#0B1C33; --indigo-deep:#0A0C10; --indigo-soft:#E3F1EC;
    --coral:#F2B705; --coral-deep:#B8890A; --danger:#C0392B;
    --ink:#14142B; --muted:#6E6C88; --surface:#FFFFFF; --surface-soft:#F6F6FB; --line:#E7E6F2;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    font-family:'IBM Plex Sans Arabic', sans-serif;
    background:var(--surface-soft); color:var(--ink);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .box{
    max-width:440px; width:100%; background:var(--surface); border:1px solid var(--line);
    border-radius:20px; padding:40px 32px; text-align:center; box-shadow:0 20px 50px -20px rgba(20,20,43,0.2);
  }
  .icon{
    width:72px; height:72px; border-radius:50%; background:var(--indigo-soft); color:var(--indigo);
    display:flex; align-items:center; justify-content:center; margin:0 auto 20px;
  }
  .icon svg{ width:34px; height:34px; }
  h1{ font-family:'IBM Plex Sans Arabic', sans-serif; font-weight:800; font-size:22px; margin-bottom:8px; }
  .reason{ color:var(--danger); font-weight:600; font-size:14px; margin-bottom:6px; }
  p.lede{ color:var(--muted); font-size:14px; line-height:1.9; margin-bottom:26px; }

  .contact{ display:flex; flex-direction:column; gap:10px; margin-bottom:20px; }
  .contact a{
    display:flex; align-items:center; justify-content:center; gap:9px;
    padding:12px; border-radius:11px; text-decoration:none; font-weight:600; font-size:14.5px;
    transition:transform .12s ease;
  }
  .contact a:hover{ transform:translateY(-2px); }
  .contact a svg{ width:19px; height:19px; flex-shrink:0; }
  .wa{ background:#25D366; color:#fff; }
  .call{ background:var(--indigo); color:#fff; }
  .fb{ background:#1877F2; color:#fff; }

  .logout{ background:none; border:none; color:var(--muted); font-size:13px; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>
    </div>
    <h1>حسابك غير مفعّل حالياً</h1>
    <div class="reason" id="reasonText">انتهت صلاحية الترخيص</div>
    <p class="lede">للأسف تم إيقاف الوصول لبيانات النظام مؤقتاً. تواصل مع فريق الدعم لتفعيل حسابك واستكمال استخدام فَصلي.</p>

    <div class="contact" id="contactLinks">
      <!-- تُملأ ديناميكياً -->
    </div>

    <button class="logout" onclick="doLogout()">تسجيل الخروج</button>
  </div>

  <script>
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

        const PROJECT_URL = 'https://yxkyxxzcnxpxefodfxnl.supabase.co';

    // ✅ استرجاع الجلسة المحفوظة (تذكرني) لو موجودة ومفيش جلسة حالية في التبويب ده
    (function restoreRememberedSession() {
      if (!sessionStorage.getItem('jwtToken') && localStorage.getItem('fasliRememberMe') === 'true') {
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key === 'fasliRememberMe') continue;
          sessionStorage.setItem(key, localStorage.getItem(key));
        }
      }
    })();


    const lockReason = sessionStorage.getItem('lockReason');
    const lockWhatsapp = sessionStorage.getItem('lockWhatsapp');
    const lockPhone = sessionStorage.getItem('lockPhone');
    const lockAudience = sessionStorage.getItem('lockAudience') || 'admin';

    if (lockReason) document.getElementById('reasonText').textContent = lockReason;

    if (lockAudience === 'teacher') {
      document.querySelector('.lede').textContent = 'تم إيقاف الوصول لحسابك مؤقتاً. تواصل مع المدرس الخاص بك لحل المشكلة.';
    }

    function doLogout() {
      sessionStorage.clear();
      window.location.href = 'login.html';
    }

    function renderContactLinks(data) {
      const container = document.getElementById('contactLinks');
      let html = '';
      if (data.whatsapp_number) {
        html += `<a class="wa" href="https://wa.me/${data.whatsapp_number}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.6 6.3A8.9 8.9 0 0 0 12 4a8.9 8.9 0 0 0-7.7 13.4L3 21l3.7-1.3A8.9 8.9 0 0 0 12 21a8.9 8.9 0 0 0 8.9-8.9c0-2.4-1-4.6-2.6-6.3zM12 19.3c-1.4 0-2.8-.4-4-1.1l-.3-.2-2.7 1 .9-2.6-.2-.3A7.2 7.2 0 1 1 19.2 12 7.2 7.2 0 0 1 12 19.3z"/></svg>
          تواصل عبر واتساب</a>`;
      }
      if (data.phone_number) {
        html += `<a class="call" href="tel:${data.phone_number}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 2 .7 3a2 2 0 0 1-.4 2.1L8 10.2a16 16 0 0 0 6 6l1.4-1.4a2 2 0 0 1 2.1-.4c1 .4 2 .6 3 .7a2 2 0 0 1 1.7 2z"/></svg>
          اتصال هاتفي: ${data.phone_number}</a>`;
      }
      if (data.facebook_url) {
        html += `<a class="fb" href="${data.facebook_url}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 21v-7.5H16l.4-3H13.5V8.4c0-.9.2-1.5 1.5-1.5H16.5V4.2C16.2 4.1 15.2 4 14 4c-2.3 0-4 1.4-4 4v2.5H7.5v3H10V21h3.5z"/></svg>
          صفحتنا على فيسبوك</a>`;
      }
      container.innerHTML = html || '<p style="color:var(--muted);font-size:13px;">لا توجد بيانات تواصل متاحة حالياً</p>';
    }

    async function loadContactInfo() {
      // ✅ لو جاي من صفحة تسجيل الدخول، البيانات موجودة بالفعل (المدرس أو الإدارة حسب الحالة)
      if (lockWhatsapp || lockPhone) {
        renderContactLinks({ whatsapp_number: lockWhatsapp || null, phone_number: lockPhone || null });
        return;
      }
      // احتياطي (دخول مباشر على الصفحة بدون مرور بتسجيل الدخول): بيانات الإدارة العامة
      const container = document.getElementById('contactLinks');
      try {
        const res = await fetch(PROJECT_URL + '/functions/v1/get-system-settings');
        const result = await res.json();
        renderContactLinks(result.data || {});
      } catch (e) {
        container.innerHTML = '<p style="color:var(--muted);font-size:13px;">تعذر تحميل بيانات التواصل</p>';
      }
    }
    loadContactInfo();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
