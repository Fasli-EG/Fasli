# .github/workflows/build-android.yml
# بناء تلقائي مجاني لملف APK + نشره كـ Release على GitHub برابط ثابت
# مثال: git tag v1.0.0 && git push origin v1.0.0

name: Build Android App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        working-directory: ./mobile
        run: npm install

      - name: Add Android platform
        working-directory: ./mobile
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: ./mobile
        run: npx cap sync android

      - name: Rename APK for clarity
        working-directory: ./mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/فصلي.apk

      - name: Upload to GitHub Release (رابط ثابت دايماً)
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/android/app/build/outputs/apk/debug/فصلي.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
