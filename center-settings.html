<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إعدادات السنتر - فَصلي</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo-icon.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B1C33">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css?v=53">
</head>
<body>

  <div class="app-shell">
    <div id="app-shell-sidebar-slot"></div>
    <script src="layout.js?v=2"></script>
    <script>renderCenterShell({active:'settings'});</script>

    <div class="main-area">
      <div class="topbar">
        <button class="sidebar-toggle-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
        <h2>إعدادات السنتر</h2>
      </div>

      <div class="container">
        <div id="dashboardLoading" style="text-align:center;padding:60px;color:var(--gray-400);">
          <i class="fas fa-spinner fa-spin" style="font-size:28px;display:block;margin-bottom:10px;"></i>جاري تحميل الإعدادات...
        </div>

        <div id="dashboardContent" style="display:none;">
          <div class="card">
            <div class="card-header">
              <h3><i class="fas fa-palette" style="color:var(--primary);"></i> الشعار واللون المميز للسنتر</h3>
            </div>
            <div class="card-body">
              <p style="color:var(--gray-500);font-size:13px;margin-bottom:14px;">
                يظهر تلقائياً لمدرسيك التابعين للسنتر (اللي ماعندهمش شعار خاص بيهم)، وليك في لوحتك هنا.
              </p>
              <div class="field-row">
                <div class="field">
                  <label>🖼️ رابط الشعار (اختياري)</label>
                  <input type="text" id="brandLogoUrlInput" placeholder="https://..." dir="ltr">
                </div>
                <div class="field">
                  <label>🎨 اللون الأساسي</label>
                  <input type="color" id="brandColorInput" style="width:100%;height:44px;padding:4px;">
                </div>
              </div>
              <button class="btn btn-primary" onclick="saveBranding()"><i class="fas fa-save"></i> حفظ الشعار واللون</button>
              <div id="brandingMessage" class="message" style="margin-top:10px;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    const PROJECT_URL = 'https://yxkyxxzcnxpxefodfxnl.supabase.co';
    const TOKEN_KEY = 'jwtToken';
    const LOGIN_URL = 'login.html';

    function getToken() { return sessionStorage.getItem(TOKEN_KEY); }
    function getAuthHeaders() {
      const token = getToken();
      if (!token) return null;
      return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function showToast(message, type) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'toast ' + (type || 'info');
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => { if (toast.parentNode) toast.remove(); }, 4000);
    }

    const centerClientId = sessionStorage.getItem('clientId');
    if (!centerClientId) window.location.href = LOGIN_URL;

    function handleUnauthorized(message = 'انتهت صلاحية الجلسة') {
      showToast('⛔ ' + message, 'error');
      setTimeout(() => {
        sessionStorage.clear(); localStorage.clear();
        window.location.href = LOGIN_URL;
      }, 2000);
    }

    async function logout() {
      sessionStorage.clear(); localStorage.clear();
      window.location.href = LOGIN_URL;
    }

    function getThemeKey() { return 'theme_' + centerClientId; }
    (function() {
      const savedTheme = localStorage.getItem(getThemeKey());
      if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
      else if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'dark');
    })();
    function toggleDarkMode() {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem(getThemeKey(), next);
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebarBackdrop');
      if (window.innerWidth <= 900) {
        sidebar.classList.toggle('open');
        backdrop.classList.toggle('open');
      } else {
        sidebar.classList.toggle('collapsed');
      }
    }

    async function loadCenterSettings() {
      try {
        const headers = getAuthHeaders();
        if (!headers) { window.location.href = LOGIN_URL; return; }

        const response = await fetch(PROJECT_URL + '/functions/v1/get-center-dashboard', { method: 'POST', headers, body: '{}' });
        if (response.status === 401) { handleUnauthorized(); return; }
        const result = await response.json();

        if (!result.success) {
          document.getElementById('dashboardLoading').innerHTML = '<p style="color:var(--danger);">❌ ' + escapeHtml(result.message) + '</p>';
          return;
        }

        const { center } = result.data;
        document.getElementById('centerNameHeader').textContent = center.name;
        document.getElementById('brandLogoUrlInput').value = center.brand_logo_url || '';
        document.getElementById('brandColorInput').value = center.brand_color || '#F2B705';

        document.getElementById('dashboardLoading').style.display = 'none';
        document.getElementById('dashboardContent').style.display = 'block';
      } catch (error) {
        console.error('❌ خطأ في تحميل الإعدادات:', error);
        document.getElementById('dashboardLoading').innerHTML = '<p style="color:var(--danger);">❌ تعذر تحميل البيانات</p>';
      }
    }

    function showBrandingMessage(text, type) {
      const el = document.getElementById('brandingMessage');
      el.textContent = text;
      el.className = 'message ' + type;
      el.style.display = 'block';
    }

    async function saveBranding() {
      const brandLogoUrl = document.getElementById('brandLogoUrlInput').value.trim();
      const brandColor = document.getElementById('brandColorInput').value.trim();

      try {
        const headers = getAuthHeaders();
        if (!headers) return;
        const response = await fetch(PROJECT_URL + '/functions/v1/manage-center', {
          method: 'POST', headers, body: JSON.stringify({ action: 'setBranding', brandLogoUrl, brandColor })
        });
        const result = await response.json();
        if (result.success) {
          showBrandingMessage('✅ ' + result.message, 'success');
          sessionStorage.setItem('brandLogoUrl', brandLogoUrl || '');
          sessionStorage.setItem('brandColor', brandColor || '');
          if (localStorage.getItem('fasliRememberMe') === 'true') {
            localStorage.setItem('brandLogoUrl', brandLogoUrl || '');
            localStorage.setItem('brandColor', brandColor || '');
          }
          // ✅ (طلب) التخصيص بقى أشمل (كروت + قائمة جانبية مع اللون الأساسي) — استخدام applyBrandColor الموحّدة بدل تعيين --primary لوحدها
          if (brandColor && window.applyBrandColor) {
            window.applyBrandColor(brandColor);
          } else if (brandColor) {
            document.documentElement.style.setProperty('--primary', brandColor);
          }
        } else {
          showBrandingMessage('❌ ' + result.message, 'error');
        }
      } catch (error) {
        console.error('❌ خطأ في حفظ الشعار/اللون:', error);
        showBrandingMessage('❌ فشل حفظ الشعار/اللون: ' + error.message, 'error');
      }
    }

    window.onload = function() {
      loadCenterSettings();
    };
  </script>
  <script src="branding.js?v=2"></script>
</body>
</html>
