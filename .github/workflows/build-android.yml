# .github/workflows/build-android.yml
# بناء تلقائي مجاني لملف APK + نشره كـ Release على GitHub برابط ثابت
# مثال: git tag v1.0.0 && git push origin v1.0.0

name: Build Android App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # 👈 ده اللي بيظهّر زرار "Run workflow" اليدوي في GitHub

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        working-directory: ./native-app-config-v2/mobile
        run: npm install

      - name: Add Android platform
        working-directory: ./native-app-config-v2/mobile
        run: npx cap add android

      - name: Add Firebase (google-services.json) for Push Notifications
        working-directory: ./native-app-config-v2/mobile
        run: |
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
            # نضيف classpath خدمات جوجل لملف build.gradle على مستوى المشروع لو مش موجود بالفعل
            if ! grep -q "com.google.gms:google-services" android/build.gradle; then
              sed -i "/classpath 'com.android.tools.build:gradle/a\\        classpath 'com.google.gms:google-services:4.4.2'" android/build.gradle
            fi
            # نفعّل الـ plugin على مستوى التطبيق نفسه لو مش مفعّل بالفعل
            if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
              echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
            fi
            echo "✅ تم ربط Firebase بمشروع الأندرويد"
          else
            echo "⚠️ ملف mobile/google-services.json مش موجود - الإشعارات مش هتشتغل في النسخة دي"
          fi

      - name: Generate app icons (لوجو فَصلي بدل الأيقونة الافتراضية)
        working-directory: ./native-app-config-v2/mobile
        run: npx @capacitor/assets generate --android

      - name: Sync Capacitor
        working-directory: ./native-app-config-v2/mobile
        run: npx cap sync android

      - name: Use fixed debug keystore (بديل عن مفتاح عشوائي مختلف في كل تشغيل)
        # ✅ لازم بصمة توقيع ثابتة للتطبيق عشان تسجيل الدخول بالبصمة (Digital Asset Links)
        # يشتغل — لو المفتاح بيتغيّر كل مرة، أي إعداد assetlinks.json بيبقى غير صالح فورًا
        run: |
          mkdir -p ~/.android
          cp native-app-config-v2/mobile/keystore/debug.keystore ~/.android/debug.keystore

      - name: Rename APK for clarity
        working-directory: ./native-app-config-v2/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/فصلي.apk

      - name: Upload to GitHub Release (رابط ثابت دايماً - بس لو دفعت tag حقيقي)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: native-app-config-v2/mobile/android/app/build/outputs/apk/debug/فصلي.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload as build artifact (دايماً، حتى لو تشغيل يدوي للتجربة)
        uses: actions/upload-artifact@v4
        with:
          name: fasli-android-apk
          path: native-app-config-v2/mobile/android/app/build/outputs/apk/debug/فصلي.apk
