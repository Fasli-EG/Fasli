<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تغيير كلمة المرور - فَصلي</title>
  <meta name="description" content="تغيير كلمة المرور في نظام فَصلي">
  <link rel="icon" type="image/svg+xml" href="/Fasli/assets/logo-icon-DMEeWQpm.svg">
  <link rel="manifest" href="/Fasli/assets/manifest-XTV9Elqy.json">
  <meta name="theme-color" content="#0B1C33">
  <link rel="apple-touch-icon" href="/Fasli/assets/apple-touch-icon-BalDJVJg.png">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
  <style>*{box-sizing:border-box;margin:0;padding:0}body{direction:rtl;background:#f7f4ee;justify-content:center;align-items:center;min-height:100vh;font-family:IBM Plex Sans Arabic,system-ui,sans-serif;display:flex}.container{background:#fff;border-top:4px solid #f2b705;border-radius:20px;width:100%;max-width:420px;padding:40px;box-shadow:0 24px 55px -24px #0a12204d}.brand-lockup{justify-content:center;align-items:center;gap:8px;margin-bottom:22px;display:flex}.brand-lockup img{border-radius:8px;width:32px;height:32px}.brand-lockup span{color:#0b1c33;font-family:Cairo,sans-serif;font-size:19px;font-weight:900}h1{text-align:center;color:#0b1c33;margin-bottom:8px;font-family:Cairo,sans-serif;font-size:21px;font-weight:800}.subtitle{text-align:center;color:#718096;margin-bottom:24px;font-size:14px}.field{margin-bottom:16px}.field label{color:#2d3748;margin-bottom:6px;font-size:14px;font-weight:500;display:block}.field input{border:1px solid #e2e8f0;border-radius:8px;width:100%;padding:12px 14px;font-family:inherit;font-size:14px;transition:border-color .2s}.field input:focus{border-color:#f2b705;outline:none;box-shadow:0 0 0 3px #48bb781a}.field input[readonly]{color:#4a5568;background:#f7fafc}.btn{color:#0b1c33;cursor:pointer;background:linear-gradient(155deg,#f2b705 0%,#b8890a 100%);border:none;border-radius:10px;width:100%;padding:13px;font-family:Cairo,sans-serif;font-size:16px;font-weight:800;transition:filter .15s,transform .1s;box-shadow:0 14px 30px -14px #b8890a80}.btn:hover{filter:brightness(1.05)}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.6;cursor:not-allowed}.btn-secondary{background:#718096;width:auto;padding:8px 20px;font-size:14px}.btn-secondary:hover{background:#4a5568}.message{text-align:center;border-radius:8px;margin-top:16px;padding:12px;font-size:14px;display:none}.message.success{color:#1faa6d;background:#e7f8f0;border:1px solid #b8dfcb;display:block}.message.error{color:#e53e3e;background:#fff5f5;border:1px solid #fed7d7;display:block}.message.info{color:#3d7dd8;background:#e7f1fc;border:1px solid #cfe3fb;display:block}.requirements{color:#a0aec0;margin-top:4px;font-size:12px}.back-link{text-align:center;margin-top:16px}.back-link a{color:#718096;font-size:14px;text-decoration:none}.back-link a:hover{text-decoration:underline}.role-badge{color:#0e8074;background:#e1f7f3;border-radius:20px;margin-bottom:16px;padding:4px 14px;font-size:12px;font-weight:600;display:inline-block}</style>
</head>
<body>
  <div class="container">
    <div class="brand-lockup"><img src="/Fasli/assets/logo-icon-DMEeWQpm.svg" alt="شعار فَصلي"><span>فَصلي</span></div>
    <h1>🔑 تغيير كلمة المرور</h1>
    <p class="subtitle">أول تسجيل دخول، يرجى تعيين كلمة مرور جديدة</p>
    
    <form id="changeForm" onsubmit="handleChangePassword(event)">
      <div class="field">
        <label id="usernameLabel">👤 اسم المستخدم</label>
        <input type="text" id="username" readonly>
      </div>
      
      <div style="text-align:center; margin-bottom:16px;">
        <span class="role-badge" id="roleBadge">👨‍🏫 مدرس</span>
      </div>
      
      <div class="field">
        <label>🔐 كلمة المرور الجديدة</label>
        <input type="password" id="newPassword" placeholder="أدخل كلمة مرور قوية" required minlength="4">
        <div class="requirements">📌 يجب أن تكون 4 أحرف على الأقل</div>
      </div>
      
      <div class="field">
        <label>✅ تأكيد كلمة المرور</label>
        <input type="password" id="confirmPassword" placeholder="أعد إدخال كلمة المرور" required>
      </div>
      
      <button type="submit" class="btn" id="changeBtn">💾 حفظ كلمة المرور</button>
    </form>
    
    <div id="message" class="message"></div>
    
    <div class="back-link">
      <a href="login.html">↩️ العودة لتسجيل الدخول</a>
    </div>
  </div>

  <script>
  // 🔒 اعتراض تلقائي: أي استجابة "402 ترخيص منتهي/معطّل" من أي دالة، نحوّل المستخدم فوراً لصفحة القفل
  (function() {
    if (window.__licenseInterceptorInstalled) return;
    window.__licenseInterceptorInstalled = true;
    const _origFetch = window.fetch;
    window.fetch = async function(...args) {
      const res = await _origFetch.apply(this, args);
      try {
        const urlStr = String(args[0]);
        if (res.status === 402 && urlStr.includes('/functions/v1/')) {
          const clone = res.clone();
          const data = await clone.json();
          if (data && data.code === 'LICENSE_EXPIRED') {
            // ✅ بنحط الرسالة الحقيقية + اسم الدالة اللي رجّعت الخطأ في sessionStorage
            // (مش URL parameter) عشان صفحة القفل تقدر تقراها وتعرضها صح للتشخيص
            sessionStorage.setItem('lockReason', data.message || 'انتهت صلاحية الترخيص');
            sessionStorage.setItem('lockSourceFunction', urlStr);
            window.location.href = 'license-locked.html';
          }
        }
      } catch (e) { /* تجاهل */ }
      return res;
    };
  })();

    // 🔑 تكوين Supabase - نستخدم التوكن من الجلسة
    const PROJECT_URL = 'https://yxkyxxzcnxpxefodfxnl.supabase.co';

    // ✅ استرجاع الجلسة المحفوظة (تذكرني) لو موجودة ومفيش جلسة حالية في التبويب ده
    (function restoreRememberedSession() {
      if (!sessionStorage.getItem('jwtToken') && localStorage.getItem('fasliRememberMe') === 'true') {
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key === 'fasliRememberMe') continue;
          sessionStorage.setItem(key, localStorage.getItem(key));
        }
      }
    })();


    const messageDiv = document.getElementById('message');
    const changeBtn = document.getElementById('changeBtn');

    // ============================================
    // مساعدات التوكن - محسنة
    // ============================================
    function getToken() {
      const token = sessionStorage.getItem('jwtToken');
      if (!token) {
        return null;
      }
      return token;
    }

    function isTokenValid() {
      const token = getToken();
      if (!token) return false;
      try {
        const parts = token.split('.');
        if (parts.length !== 3) return false;
        const payload = JSON.parse(atob(parts[1]));
        const exp = payload.exp;
        if (exp) {
          const now = Math.floor(Date.now() / 1000);
          if (exp < now) return false;
        }
        return true;
      } catch (e) {
        return false;
      }
    }

    function handleUnauthorized(message = 'انتهت صلاحية الجلسة') {
      showMessage('⛔ ' + message + '، يرجى تسجيل الدخول مرة أخرى', 'error');
      setTimeout(() => {
        sessionStorage.removeItem('jwtToken');
        sessionStorage.removeItem('clientId');
        sessionStorage.removeItem('teacherClientId');
        sessionStorage.removeItem('userRole');
        window.location.href = 'login.html';
      }, 1500);
    }

    // ============================================
    // عرض الرسائل
    // ============================================
    function showMessage(text, type = 'info') {
      messageDiv.textContent = text;
      messageDiv.className = 'message ' + type;
    }

    function hideMessage() {
      messageDiv.className = 'message';
      messageDiv.textContent = '';
    }

    // ============================================
    // تهيئة الصفحة
    // ============================================
    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const role = urlParams.get('role') || 'teacher';
      let username = '';

      if (role === 'teacher') {
        username = urlParams.get('clientId') || sessionStorage.getItem('tempClientId');
        document.getElementById('usernameLabel').textContent = '👤 كود المدرس (Client ID)';
        document.getElementById('roleBadge').textContent = '👨‍🏫 مدرس';
      } else if (role === 'assistant') {
        username = urlParams.get('username') || sessionStorage.getItem('tempAssistantId');
        document.getElementById('usernameLabel').textContent = '👤 اسم المستخدم';
        document.getElementById('roleBadge').textContent = '👤 مساعد';
      } else if (role === 'parent') {
        username = urlParams.get('phone') || sessionStorage.getItem('tempParentPhone');
        document.getElementById('usernameLabel').textContent = '📱 رقم الهاتف';
        document.getElementById('roleBadge').textContent = '👨‍👩‍👦 ولي أمر';
      } else if (role === 'student') {
        username = urlParams.get('studentUid') || sessionStorage.getItem('tempStudentUid');
        document.getElementById('usernameLabel').textContent = '🆔 كود الكارت';
        document.getElementById('roleBadge').textContent = '🎓 طالب';
      } else {
        showMessage('❌ دور غير معروف', 'error');
        return;
      }

      if (!username) {
        showMessage('❌ لم يتم العثور على اسم المستخدم. يرجى المحاولة مرة أخرى.', 'error');
        return;
      }

      document.getElementById('username').value = username;
      sessionStorage.setItem('changeRole', role);
    };

    // ============================================
    // معالجة تغيير كلمة المرور
    // ============================================
    async function handleChangePassword(event) {
      event.preventDefault();
      hideMessage();

      const username = document.getElementById('username').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const role = sessionStorage.getItem('changeRole') || 'teacher';

      if (!username) {
        showMessage('❌ لم يتم العثور على اسم المستخدم', 'error');
        return;
      }

      if (newPassword.length < 4) {
        showMessage('⚠️ كلمة المرور يجب أن تكون 4 أحرف على الأقل', 'error');
        return;
      }

      if (newPassword !== confirmPassword) {
        showMessage('⚠️ كلمتا المرور غير متطابقتين', 'error');
        return;
      }

      // 🔒 استخدام التوكن المخزن في الجلسة (إذا كان موجوداً)
      const token = getToken();
      // إذا لم يكن هناك توكن، نطلب تسجيل الدخول أولاً
      if (!token) {
        showMessage('❌ يرجى تسجيل الدخول أولاً لتغيير كلمة المرور', 'error');
        setTimeout(() => { window.location.href = 'login.html'; }, 1500);
        return;
      }

      changeBtn.disabled = true;
      changeBtn.textContent = '⏳ جاري الحفظ...';

      try {
        const response = await fetch(PROJECT_URL + '/functions/v1/change-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token   // ✅ نستخدم التوكن بدلاً من المفتاح العام
          },
          body: JSON.stringify({
            username: username,
            newPassword: newPassword,
            role: role
          })
        });

        // ✅ التحقق من 401
        if (response.status === 401) {
          handleUnauthorized('انتهت صلاحية الجلسة');
          return;
        }

        const data = await response.json();

        if (data.success) {
          showMessage('✅ تم حفظ كلمة المرور، جاري تجهيز حسابك...', 'success');

          // ✅ نسجّل دخول تلقائي بالباسورد الجديد عشان نجيب كل بيانات الجلسة كاملة وصحيحة
          // (اسم المستخدم، صلاحيات المساعد، اسم المدرس التابع له...) بدل ما نخمّنها ناقصة هنا
          try {
            const loginResponse = await fetch(PROJECT_URL + '/functions/v1/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username: username, password: newPassword, role: role })
            });
            const loginData = await loginResponse.json();

            if (!loginData.success) {
              // نادر جداً (يعني الباسورد الجديد اتحفظ لكن تسجيل الدخول بيه فشل) — نرجّعه لصفحة الدخول العادية
              showMessage('✅ تم حفظ كلمة المرور، سجّل دخولك بيها من صفحة الدخول', 'success');
              setTimeout(() => { window.location.href = 'login.html'; }, 1800);
              return;
            }

            if (loginData.token) sessionStorage.setItem('jwtToken', loginData.token);
            const d = loginData.data || {};

            if (role === 'teacher') {
              sessionStorage.setItem('clientId', username);
              sessionStorage.setItem('teacherName', d.name || 'مدرس');
              sessionStorage.setItem('isAdmin', d.isAdmin ? 'true' : 'false');
              sessionStorage.setItem('userRole', 'teacher');
              sessionStorage.setItem('brandLogoUrl', d.brandLogoUrl || '');
              sessionStorage.setItem('brandColor', d.brandColor || '');
              sessionStorage.setItem('isCenter', d.isCenter ? 'true' : 'false');
              sessionStorage.removeItem('tempClientId');
            } else if (role === 'assistant') {
              sessionStorage.setItem('assistantId', d.id || username);
              sessionStorage.setItem('assistantName', d.name || 'مساعد');
              sessionStorage.setItem('assistantPermissions', JSON.stringify(d.permissions || {}));
              sessionStorage.setItem('teacherClientId', d.teacherId || '');
              sessionStorage.setItem('teacherName', d.teacherName || 'مدرس');
              sessionStorage.setItem('userRole', 'assistant');
              sessionStorage.setItem('brandLogoUrl', d.brandLogoUrl || '');
              sessionStorage.setItem('brandColor', d.brandColor || '');
              sessionStorage.setItem('isCenter', d.isCenter ? 'true' : 'false');
              sessionStorage.removeItem('tempAssistantId');
            } else if (role === 'parent') {
              sessionStorage.setItem('parentPhone', username);
              sessionStorage.setItem('parentName', d.name || 'ولي أمر');
              sessionStorage.setItem('userRole', 'parent');
              sessionStorage.removeItem('tempParentPhone');
            } else {
              sessionStorage.setItem('studentUid', username);
              sessionStorage.setItem('studentName', d.name || 'طالب');
              sessionStorage.setItem('studentGroup', d.groupName || '');
              sessionStorage.setItem('studentTeacherId', d.teacherId || '');
              sessionStorage.setItem('userRole', 'student');
              sessionStorage.removeItem('tempStudentUid');
            }

            setTimeout(() => {
              if (role === 'teacher') {
                window.location.href = (username === 'master_admin') ? 'admin-teachers.html' : 'dashboard.html';
              } else if (role === 'assistant') window.location.href = 'assistant-dashboard.html';
              else if (role === 'parent') window.location.href = 'parent-dashboard.html';
              else window.location.href = 'student-portal.html';
            }, 900);
          } catch (loginError) {
            console.error('❌ خطأ في إعادة تسجيل الدخول:', loginError);
            showMessage('✅ تم حفظ كلمة المرور، سجّل دخولك بيها من صفحة الدخول', 'success');
            setTimeout(() => { window.location.href = 'login.html'; }, 1800);
          }
        } else {
          showMessage('❌ ' + data.message, 'error');
        }
      } catch (error) {
        console.error('❌ خطأ:', error);
        showMessage('❌ حدث خطأ في الاتصال بالخادم: ' + error.message, 'error');
      } finally {
        changeBtn.disabled = false;
        changeBtn.textContent = '💾 حفظ كلمة المرور';
      }
    }
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
