<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تغيير كلمة المرور - فَصلي</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='28' fill='%2314171F'/%3E%3Cpath d='M25,98 L44,70 L76,70 L95,98 Z' fill='%230F6B4F'/%3E%3Crect x='44' y='18' width='32' height='52' rx='5' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#14171F">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* الأنماط كما هي موجودة مسبقاً، لم تتغير */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      direction: rtl;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      max-width: 420px;
      width: 100%;
    }
    h1 { text-align: center; color: #1a202c; margin-bottom: 8px; }
    .subtitle { text-align: center; color: #718096; font-size: 14px; margin-bottom: 24px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-weight: 500; color: #2d3748; margin-bottom: 6px; font-size: 14px; }
    .field input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    .field input:focus {
      outline: none;
      border-color: #0F6B4F;
      box-shadow: 0 0 0 3px rgba(72, 187, 120, 0.1);
    }
    .field input[readonly] {
      background: #f7fafc;
      color: #4a5568;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: #0F6B4F;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      font-family: inherit;
    }
    .btn:hover { background: #0B4E3A; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary {
      background: #718096;
      width: auto;
      padding: 8px 20px;
      font-size: 14px;
    }
    .btn-secondary:hover { background: #4a5568; }
    .message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      display: none;
    }
    .message.success { display: block; background: #E3F1EC; color: #0B4E3A; border: 1px solid #B8DFCB; }
    .message.error { display: block; background: #fff5f5; color: #e53e3e; border: 1px solid #fed7d7; }
    .message.info { display: block; background: #E3F1EC; color: #0F6B4F; border: 1px solid #B8DFCB; }
    .requirements { font-size: 12px; color: #a0aec0; margin-top: 4px; }
    .back-link { text-align: center; margin-top: 16px; }
    .back-link a { color: #718096; text-decoration: none; font-size: 14px; }
    .back-link a:hover { text-decoration: underline; }
    .role-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      background: #E3F1EC;
      color: #0F6B4F;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔑 تغيير كلمة المرور</h1>
    <p class="subtitle">أول تسجيل دخول، يرجى تعيين كلمة مرور جديدة</p>
    
    <form id="changeForm" onsubmit="handleChangePassword(event)">
      <div class="field">
        <label id="usernameLabel">👤 اسم المستخدم</label>
        <input type="text" id="username" readonly>
      </div>
      
      <div style="text-align:center; margin-bottom:16px;">
        <span class="role-badge" id="roleBadge">👨‍🏫 مدرس</span>
      </div>
      
      <div class="field">
        <label>🔐 كلمة المرور الجديدة</label>
        <input type="password" id="newPassword" placeholder="أدخل كلمة مرور قوية" required minlength="4">
        <div class="requirements">📌 يجب أن تكون 4 أحرف على الأقل</div>
      </div>
      
      <div class="field">
        <label>✅ تأكيد كلمة المرور</label>
        <input type="password" id="confirmPassword" placeholder="أعد إدخال كلمة المرور" required>
      </div>
      
      <button type="submit" class="btn" id="changeBtn">💾 حفظ كلمة المرور</button>
    </form>
    
    <div id="message" class="message"></div>
    
    <div class="back-link">
      <a href="login.html">↩️ العودة لتسجيل الدخول</a>
    </div>
  </div>

  <script>
    // 🔑 تكوين Supabase - نستخدم التوكن من الجلسة
    const PROJECT_URL = 'https://yxkyxxzcnxpxefodfxnl.supabase.co';

    // ✅ استرجاع الجلسة المحفوظة (تذكرني) لو موجودة ومفيش جلسة حالية في التبويب ده
    (function restoreRememberedSession() {
      if (!sessionStorage.getItem('jwtToken') && localStorage.getItem('fasliRememberMe') === 'true') {
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key === 'fasliRememberMe') continue;
          sessionStorage.setItem(key, localStorage.getItem(key));
        }
      }
    })();


    const messageDiv = document.getElementById('message');
    const changeBtn = document.getElementById('changeBtn');

    // ============================================
    // مساعدات التوكن - محسنة
    // ============================================
    function getToken() {
      const token = sessionStorage.getItem('jwtToken');
      if (!token) {
        return null;
      }
      return token;
    }

    function isTokenValid() {
      const token = getToken();
      if (!token) return false;
      try {
        const parts = token.split('.');
        if (parts.length !== 3) return false;
        const payload = JSON.parse(atob(parts[1]));
        const exp = payload.exp;
        if (exp) {
          const now = Math.floor(Date.now() / 1000);
          if (exp < now) return false;
        }
        return true;
      } catch (e) {
        return false;
      }
    }

    function handleUnauthorized(message = 'انتهت صلاحية الجلسة') {
      showMessage('⛔ ' + message + '، يرجى تسجيل الدخول مرة أخرى', 'error');
      setTimeout(() => {
        sessionStorage.removeItem('jwtToken');
        sessionStorage.removeItem('clientId');
        sessionStorage.removeItem('teacherClientId');
        sessionStorage.removeItem('userRole');
        window.location.href = 'login.html';
      }, 1500);
    }

    // ============================================
    // عرض الرسائل
    // ============================================
    function showMessage(text, type = 'info') {
      messageDiv.textContent = text;
      messageDiv.className = 'message ' + type;
    }

    function hideMessage() {
      messageDiv.className = 'message';
      messageDiv.textContent = '';
    }

    // ============================================
    // تهيئة الصفحة
    // ============================================
    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const role = urlParams.get('role') || 'teacher';
      let username = '';

      if (role === 'teacher') {
        username = urlParams.get('clientId') || sessionStorage.getItem('tempClientId');
        document.getElementById('usernameLabel').textContent = '👤 كود المدرس (Client ID)';
        document.getElementById('roleBadge').textContent = '👨‍🏫 مدرس';
      } else if (role === 'assistant') {
        username = urlParams.get('username') || sessionStorage.getItem('tempAssistantId');
        document.getElementById('usernameLabel').textContent = '👤 اسم المستخدم';
        document.getElementById('roleBadge').textContent = '👤 مساعد';
      } else if (role === 'parent') {
        username = urlParams.get('phone') || sessionStorage.getItem('tempParentPhone');
        document.getElementById('usernameLabel').textContent = '📱 رقم الهاتف';
        document.getElementById('roleBadge').textContent = '👨‍👩‍👦 ولي أمر';
      } else {
        showMessage('❌ دور غير معروف', 'error');
        return;
      }

      if (!username) {
        showMessage('❌ لم يتم العثور على اسم المستخدم. يرجى المحاولة مرة أخرى.', 'error');
        return;
      }

      document.getElementById('username').value = username;
      sessionStorage.setItem('changeRole', role);
    };

    // ============================================
    // معالجة تغيير كلمة المرور
    // ============================================
    async function handleChangePassword(event) {
      event.preventDefault();
      hideMessage();

      const username = document.getElementById('username').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const role = sessionStorage.getItem('changeRole') || 'teacher';

      if (!username) {
        showMessage('❌ لم يتم العثور على اسم المستخدم', 'error');
        return;
      }

      if (newPassword.length < 4) {
        showMessage('⚠️ كلمة المرور يجب أن تكون 4 أحرف على الأقل', 'error');
        return;
      }

      if (newPassword !== confirmPassword) {
        showMessage('⚠️ كلمتا المرور غير متطابقتين', 'error');
        return;
      }

      // 🔒 استخدام التوكن المخزن في الجلسة (إذا كان موجوداً)
      const token = getToken();
      // إذا لم يكن هناك توكن، نطلب تسجيل الدخول أولاً
      if (!token) {
        showMessage('❌ يرجى تسجيل الدخول أولاً لتغيير كلمة المرور', 'error');
        setTimeout(() => { window.location.href = 'login.html'; }, 1500);
        return;
      }

      changeBtn.disabled = true;
      changeBtn.textContent = '⏳ جاري الحفظ...';

      try {
        const response = await fetch(PROJECT_URL + '/functions/v1/change-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token   // ✅ نستخدم التوكن بدلاً من المفتاح العام
          },
          body: JSON.stringify({
            username: username,
            newPassword: newPassword,
            role: role
          })
        });

        // ✅ التحقق من 401
        if (response.status === 401) {
          handleUnauthorized('انتهت صلاحية الجلسة');
          return;
        }

        const data = await response.json();

        if (data.success) {
          showMessage('✅ تم حفظ كلمة المرور، جاري تجهيز حسابك...', 'success');

          // ✅ نسجّل دخول تلقائي بالباسورد الجديد عشان نجيب كل بيانات الجلسة كاملة وصحيحة
          // (اسم المستخدم، صلاحيات المساعد، اسم المدرس التابع له...) بدل ما نخمّنها ناقصة هنا
          try {
            const loginResponse = await fetch(PROJECT_URL + '/functions/v1/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username: username, password: newPassword, role: role })
            });
            const loginData = await loginResponse.json();

            if (!loginData.success) {
              // نادر جداً (يعني الباسورد الجديد اتحفظ لكن تسجيل الدخول بيه فشل) — نرجّعه لصفحة الدخول العادية
              showMessage('✅ تم حفظ كلمة المرور، سجّل دخولك بيها من صفحة الدخول', 'success');
              setTimeout(() => { window.location.href = 'login.html'; }, 1800);
              return;
            }

            if (loginData.token) sessionStorage.setItem('jwtToken', loginData.token);
            const d = loginData.data || {};

            if (role === 'teacher') {
              sessionStorage.setItem('clientId', username);
              sessionStorage.setItem('teacherName', d.name || 'مدرس');
              sessionStorage.setItem('isAdmin', d.isAdmin ? 'true' : 'false');
              sessionStorage.setItem('userRole', 'teacher');
              sessionStorage.removeItem('tempClientId');
            } else if (role === 'assistant') {
              sessionStorage.setItem('assistantId', d.id || username);
              sessionStorage.setItem('assistantName', d.name || 'مساعد');
              sessionStorage.setItem('assistantPermissions', JSON.stringify(d.permissions || {}));
              sessionStorage.setItem('teacherClientId', d.teacherId || '');
              sessionStorage.setItem('teacherName', d.teacherName || 'مدرس');
              sessionStorage.setItem('userRole', 'assistant');
              sessionStorage.removeItem('tempAssistantId');
            } else {
              sessionStorage.setItem('parentPhone', username);
              sessionStorage.setItem('parentName', d.name || 'ولي أمر');
              sessionStorage.setItem('userRole', 'parent');
              sessionStorage.removeItem('tempParentPhone');
            }

            setTimeout(() => {
              if (role === 'teacher') {
                window.location.href = (username === 'master_admin') ? 'admin-teachers.html' : 'dashboard.html';
              } else if (role === 'assistant') window.location.href = 'assistant-dashboard.html';
              else window.location.href = 'parent-dashboard.html';
            }, 900);
          } catch (loginError) {
            console.error('❌ خطأ في إعادة تسجيل الدخول:', loginError);
            showMessage('✅ تم حفظ كلمة المرور، سجّل دخولك بيها من صفحة الدخول', 'success');
            setTimeout(() => { window.location.href = 'login.html'; }, 1800);
          }
        } else {
          showMessage('❌ ' + data.message, 'error');
        }
      } catch (error) {
        console.error('❌ خطأ:', error);
        showMessage('❌ حدث خطأ في الاتصال بالخادم: ' + error.message, 'error');
      } finally {
        changeBtn.disabled = false;
        changeBtn.textContent = '💾 حفظ كلمة المرور';
      }
    }
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
