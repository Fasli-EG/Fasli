    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeAttr(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

            const PROJECT_URL = 'https://yxkyxxzcnxpxefodfxnl.supabase.co';

    // ✅ استرجاع الجلسة المحفوظة (تذكرني) لو موجودة ومفيش جلسة حالية في التبويب ده
    (function restoreRememberedSession() {
      if (!sessionStorage.getItem('jwtToken') && localStorage.getItem('fasliRememberMe') === 'true') {
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key === 'fasliRememberMe') continue;
          sessionStorage.setItem(key, localStorage.getItem(key));
        }
      }
    })();

  // 🔒 اعتراض تلقائي: أي استجابة "402 ترخيص منتهي/معطّل" من أي دالة، نحوّل المستخدم فوراً لصفحة القفل
  (function() {
    if (window.__licenseInterceptorInstalled) return;
    window.__licenseInterceptorInstalled = true;
    const _origFetch = window.fetch;
    window.fetch = async function(...args) {
      const res = await _origFetch.apply(this, args);
      try {
        const urlStr = String(args[0]);
        if (res.status === 402 && urlStr.includes('/functions/v1/')) {
          const clone = res.clone();
          const data = await clone.json();
          if (data && data.code === 'LICENSE_EXPIRED') {
            // ✅ بنحط الرسالة الحقيقية + اسم الدالة اللي رجّعت الخطأ في sessionStorage
            // (مش URL parameter) عشان صفحة القفل تقدر تقراها وتعرضها صح للتشخيص
            sessionStorage.setItem('lockReason', data.message || 'انتهت صلاحية الترخيص');
            sessionStorage.setItem('lockSourceFunction', urlStr);
            window.location.href = 'license-locked.html';
          }
        }
      } catch (e) { /* تجاهل */ }
      return res;
    };
  })();
    const TOKEN_KEY = 'jwtToken';
    const LOGIN_URL = 'login.html';

    function getToken() {
      const token = sessionStorage.getItem(TOKEN_KEY);
      if (!token) return null;
      try {
        const parts = token.split('.');
        if (parts.length === 3) {
          const payload = JSON.parse(atob(parts[1]));
          const exp = payload.exp;
          if (exp) {
            const now = Math.floor(Date.now() / 1000);
            if (exp < now) {
              return token;
            }
          }
        }
      } catch (e) {
      }
      return token;
    }

    function getAuthHeaders() {
      const token = getToken();
      if (!token) return null;
      return {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      };
    }

    function isTokenValid() {
      const token = getToken();
      if (!token) return false;
      try {
        const parts = token.split('.');
        if (parts.length !== 3) return false;
        const payload = JSON.parse(atob(parts[1]));
        const exp = payload.exp;
        if (exp) {
          const now = Math.floor(Date.now() / 1000);
          if (exp < now) return false;
        }
        return true;
      } catch (e) {
        return false;
      }
    }

    let isLoggingOut = false;
    function handleUnauthorized(message = 'انتهت صلاحية الجلسة') {
      if (isTokenValid()) {
        showToast('⛔ ليس لديك صلاحية للوصول إلى هذه البيانات.', 'error');
        return;
      }

      if (isLoggingOut) return;
      isLoggingOut = true;

      showToast('⛔ ' + message + '، يرجى تسجيل الدخول مرة أخرى', 'error');

      setTimeout(() => {
        sessionStorage.removeItem(TOKEN_KEY);
        sessionStorage.removeItem('clientId');
        sessionStorage.removeItem('teacherClientId');
        sessionStorage.removeItem('userRole');
        window.location.href = LOGIN_URL;
      }, 2000);
    }

    const clientId = sessionStorage.getItem('clientId') || sessionStorage.getItem('teacherClientId');
    const userRole = sessionStorage.getItem('userRole') || 'teacher';
    const teacherName = sessionStorage.getItem('teacherName') || 'مدرس';
    const assistantName = sessionStorage.getItem('assistantName') || null;

    if (!clientId) { sessionStorage.clear(); window.location.href = LOGIN_URL; }

    const isAssistant = userRole === 'assistant';
    const assistantPermissions = JSON.parse(sessionStorage.getItem('assistantPermissions') || '{}');
    // ✅ Batch 21: الصفحة دي محتاجة صلاحية "عرض الدخل الشهري" — كانت متاحة لأي مساعد من غير
    // أي تحقق فرونت إند (السيرفر بس هو اللي كان بيرفض) فمساعد من غير الصلاحية كان يقدر يفتحها
    if (isAssistant && assistantPermissions.view_financial !== true) {
      showToast('⛔ ليس لديك صلاحية لعرض الدخل الشهري، تواصل مع المدرس', 'error');
      setTimeout(() => { window.location.href = 'assistant-dashboard.html'; }, 1500);
    }
    document.getElementById('userRoleDisplay').textContent = isAssistant ? 'مساعد' : 'مدرس';
    const displayName = isAssistant && assistantName ? assistantName : teacherName;
    document.getElementById('userDisplayName').textContent = 'مرحباً، ' + displayName;
    document.getElementById('userAvatar').textContent = displayName.charAt(0);

    // ✅ جرس الإشعارات — للمدرس والمساعد الاتنين (Aug 2026)
    {
      const notifWrap = document.getElementById('notifWrap');
      if (notifWrap) {
        notifWrap.style.display = 'block';
        loadNotifications();
        setInterval(loadNotifications, 20000);
      }
    }

    function showToast(message, type = 'info', target = 'screen') {
      let container;
      if (target === 'modal') {
        container = document.getElementById('modalToastContainer');
      } else if (target === 'attendance') {
        container = document.getElementById('attendanceModalToastContainer');
      } else {
        container = document.getElementById('toastContainer');
      }
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = 'modal-toast ' + type;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => { if (toast.parentNode) toast.remove(); }, 4000);
    }

    function getThemeKey() {
      return 'theme_' + clientId;
    }

    (function() {
      const savedTheme = localStorage.getItem(getThemeKey());
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
      } else {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (prefersDark) document.documentElement.setAttribute('data-theme', 'dark');
      }
      setTimeout(() => {
        const theme = document.documentElement.getAttribute('data-theme') || 'light';
        updateThemeIcon(theme);
      }, 100);
    })();

    function goBackToDashboard() {
      window.location.href = isAssistant ? 'assistant-dashboard.html' : 'dashboard.html';
    }

    async function downloadBackup() {
  const btn = document.getElementById('backupBtn');
  const status = document.getElementById('backupStatus');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري تجهيز النسخة الاحتياطية...';

  try {
    const headers = getAuthHeaders();
    if (!headers) return;
    const response = await fetch(PROJECT_URL + '/functions/v1/manage-backup', {
      method: 'POST',
      headers: headers,
      body: JSON.stringify({ action: 'export', clientId })
    });
    if (response.status === 401) { handleUnauthorized('انتهت صلاحية الجلسة'); return; }
    const result = await response.json();

    if (result.success) {
      const blob = new Blob([JSON.stringify(result.data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const dateStr = new Date().toISOString().split('T')[0];
      a.href = url;
      a.download = `نسخة-احتياطية-${teacherName}-${dateStr}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      status.style.display = 'block';
      status.style.color = 'var(--success)';
      status.innerHTML = '✅ تم تحميل النسخة الاحتياطية بنجاح';
      btn.innerHTML = '<i class="fas fa-check"></i> تم التحميل — تقدر تحمّلها تاني لو حبيت';
    } else {
      status.style.display = 'block';
      status.style.color = 'var(--danger)';
      status.innerHTML = '❌ ' + result.message;
      btn.innerHTML = '<i class="fas fa-download"></i> تحميل نسخة احتياطية أولاً (اختياري لكن مُنصح به)';
    }
  } catch (error) {
    console.error('❌ خطأ في تحميل النسخة الاحتياطية:', error);
    status.style.display = 'block';
    status.style.color = 'var(--danger)';
    status.innerHTML = '❌ فشل تحميل النسخة الاحتياطية: ' + error.message;
    btn.innerHTML = '<i class="fas fa-download"></i> تحميل نسخة احتياطية أولاً (اختياري لكن مُنصح به)';
  } finally {
    btn.disabled = false;
  }
}

function closeResetModal() {
  const modal = document.getElementById('resetModalOverlay');
  if (modal) modal.remove();
}

async function confirmReset() {
  const pwInput = document.getElementById('resetPasswordInput');
  const password = pwInput ? pwInput.value : '';

  if (!password) {
    showToast('⚠️ يجب إدخال كلمة المرور لتأكيد الحذف', 'error');
    if (pwInput) pwInput.focus();
    return;
  }

  const btns = document.querySelectorAll('.reset-modal-box .btn');
  btns.forEach(b => b.disabled = true);

  try {
    if (!isTokenValid()) {
      showToast('⚠️ انتهت صلاحية الجلسة، يرجى تسجيل الدخول مرة أخرى', 'error');
      handleUnauthorized();
      closeResetModal();
      return;
    }

    const token = getToken();
    if (!token) {
      closeResetModal();
      return;
    }

    // ✅ إرسال JSON صحيح + كلمة المرور للتحقق الفعلي في الخادم
    const selectedOptions = {};
    document.querySelectorAll('.reset-opt').forEach(cb => { selectedOptions[cb.value] = cb.checked; });
    const requestBody = JSON.stringify({ clientId: clientId, password: password, options: selectedOptions });

    const response = await fetch(PROJECT_URL + '/functions/v1/reset-system', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token,
        'Accept': 'application/json'
      },
      body: requestBody  // ✅ JSON صحيح
    });

    if (response.status === 401) {
      handleUnauthorized('انتهت صلاحية الجلسة');
      closeResetModal();
      return;
    }

    const result = await response.json().catch(() => ({ success: false, message: 'استجابة غير متوقعة من الخادم' }));

    if (!response.ok || !result.success) {
      showToast('❌ ' + (result.message || 'فشل تنفيذ العملية'), 'error');
      // نسيب المودال مفتوح (خصوصاً لو الباسورد غلط) عشان يقدر يحاول تاني
      if (pwInput) { pwInput.value = ''; pwInput.focus(); }
      btns.forEach(b => b.disabled = false);
      return;
    }

    showToast('✅ ' + result.message, 'success');
    setTimeout(() => {
      window.location.reload();
    }, 2000);
  } catch (error) {
    console.error('❌ خطأ أثناء الحذف:', error);
    showToast('❌ فشل حذف البيانات: ' + error.message, 'error');
    btns.forEach(b => b.disabled = false);
  }
}

    let expenseDonutChartInstance = null;
    function renderExpenseDonut(expenses, categoryLabels) {
      const wrapper = document.getElementById('expenseDonutWrapper');
      const totals = {};
      expenses.forEach(e => { totals[e.category] = (totals[e.category] || 0) + Number(e.amount); });
      const entries = Object.entries(totals).filter(([, v]) => v > 0);
      if (entries.length === 0) { wrapper.style.display = 'none'; return; }
      wrapper.style.display = 'block';

      const labels = entries.map(([cat]) => (categoryLabels[cat] || cat).replace(/^[^؀-ۿ]+/, '').trim());
      const data = entries.map(([, v]) => v);
      const brandPrimary = (getComputedStyle(document.documentElement).getPropertyValue('--primary').trim()) || '#F2B705';
      const palette = [brandPrimary, '#3D7DD8', '#1FAA6D', '#E08A2B', '#E5484D', '#8A6300'];

      const ctx = document.getElementById('expenseDonutChart').getContext('2d');
      if (expenseDonutChartInstance) {
        expenseDonutChartInstance.data.labels = labels;
        expenseDonutChartInstance.data.datasets[0].data = data;
        expenseDonutChartInstance.update();
        return;
      }
      expenseDonutChartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: { labels, datasets: [{ data, backgroundColor: palette.slice(0, data.length), borderWidth: 0 }] },
        options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { font: { size: 11 }, boxWidth: 12, padding: 8 } } }, cutout: '60%' }
      });
    }

    let notifData = [];

    function timeAgo(dateStr) {
      const diffMs = Date.now() - new Date(dateStr).getTime();
      const mins = Math.floor(diffMs / 60000);
      if (mins < 1) return 'الآن';
      if (mins < 60) return `منذ ${mins} د`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `منذ ${hrs} س`;
      const days = Math.floor(hrs / 24);
      return `منذ ${days} يوم`;
    }

    const NOTIF_ICONS = { bulk_message: '📨', center_teacher_message: '🏢', parent_message: '💬', teacher_message: '💬' };

    function playNotificationSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const now = ctx.currentTime;
        [880, 1175].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          const start = now + i * 0.12;
          gain.gain.setValueAtTime(0, start);
          gain.gain.linearRampToValueAtTime(0.18, start + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.22);
          osc.connect(gain).connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.25);
        });
      } catch (e) { /* بعض المتصفحات بتمنع الصوت قبل أي تفاعل من المستخدم، نتجاهل بهدوء */ }
    }

    // ✅ بنحسب مكان القائمة فعلياً وقت كل فتحة، بناءً على موقع زرار الجرس الحقيقي وحجم الشاشة الحالي —
    // ده بيضمن رياضياً إنها تفضل جوه حدود الشاشة تماماً، مهما كان حجم الجهاز أو عرض نافذة المتصفح
    function positionNotifPanel() {
      const panel = document.getElementById('notifPanel');
      const btn = document.getElementById('notifBtn') || document.querySelector('.notif-wrap');
      if (!panel || !btn) return;
      const btnRect = btn.getBoundingClientRect();
      const margin = 12;
      const panelWidth = Math.min(340, window.innerWidth - margin * 2);
      let left = btnRect.right - panelWidth;
      if (left < margin) left = margin;
      if (left + panelWidth > window.innerWidth - margin) left = window.innerWidth - margin - panelWidth;
      panel.style.position = 'fixed';
      panel.style.left = left + 'px';
      panel.style.right = 'auto';
      panel.style.width = panelWidth + 'px';
      // ✅ Batch 24 (بند 4): بعد نقل الجرس لذيل القائمة الجانبية (تحت خالص)، فتح البانل تحت
      // الزرار عادي هيطلعه خارج حدود الشاشة — لو مفيش مساحة كافية تحت، نفتحه لفوق بدل كده
      const estimatedHeight = Math.min(420, window.innerHeight - margin * 2);
      const spaceBelow = window.innerHeight - btnRect.bottom - margin;
      if (spaceBelow < estimatedHeight && btnRect.top > estimatedHeight) {
        panel.style.bottom = (window.innerHeight - btnRect.top + 10) + 'px';
        panel.style.top = 'auto';
      } else {
        panel.style.top = (btnRect.bottom + 10) + 'px';
        panel.style.bottom = 'auto';
      }
    }

    document.addEventListener('click', function(e) {
      const wrap = document.querySelector('.notif-wrap');
      if (wrap && !wrap.contains(e.target)) {
        document.getElementById('notifPanel').classList.remove('open');
      }
    });

    async function markOneRead(id) {
      const item = notifData.find(n => n.id === id);
      const wasUnread = item && !item.is_read;
      try {
        // ✅ (تعديل) الضغط على إشعار مقروء بالفعل كان مش بيعمل أي حاجة خالص (return مبكر) —
        // دلوقتي بيوديك لمكان الإشعار برضه حتى لو كان مقروء من قبل، وبس اللي بيتعلَّم كمقروء
        // فعلياً (نداء الـ API) هو اللي بيتخطّى لو كان مقروء أصلاً
        if (wasUnread) {
          const headers = getAuthHeaders();
          if (headers) {
            await fetch(PROJECT_URL + '/functions/v1/mark-notification-read', {
              method: 'POST', headers, body: JSON.stringify({ notificationId: id })
            });
            item.is_read = true;
            const badge = document.getElementById('notifBadge');
            const unread = notifData.filter(n => !n.is_read).length;
            if (unread > 0) { badge.style.display = 'flex'; badge.textContent = unread > 9 ? '9+' : unread; }
            else badge.style.display = 'none';
            renderNotifList();
          }
        }
        // ✅ Batch 24 (بند 6): بعد تعليم الإشعار كمقروء، نوجّه المستخدم لمكان الإشعار نفسه بدل
        // ما يفضل واقف في نفس الصفحة من غير ما يعرف يوصل للمحادثة/الطالب الخاص بالإشعار
        if (item) {
          if (item.type === 'parent_message' && item.student_uid) {
            const nm = (item.details && item.details.student_name) || '';
            window.location.href = 'messages.html?openConversation=' + encodeURIComponent(item.student_uid) + (nm ? '&name=' + encodeURIComponent(nm) : '');
          } else if (item.type === 'center_teacher_message') {
            window.location.href = 'messages.html';
          }
        }
      } catch (error) {
        console.error('❌ خطأ في تعليم الإشعار كمقروء:', error);
      }
    }

    async function markAllRead() {
      try {
        const headers = getAuthHeaders();
        if (!headers) return;
        await fetch(PROJECT_URL + '/functions/v1/mark-notification-read', {
          method: 'POST', headers, body: JSON.stringify({ markAll: true })
        });
        notifData.forEach(n => n.is_read = true);
        document.getElementById('notifBadge').style.display = 'none';
        renderNotifList();
      } catch (error) {
        console.error('❌ خطأ في تعليم الكل كمقروء:', error);
      }
    }

    // ✅ Aug 2026: تبديل تبويبات صفحة الدخل الشهري — كل بيانات الصفحة بتتحمّل مرة واحدة في
    // window.onload (loadFinancialSummary بينادي loadExpenses/renderFinancialFilter جواها أصلاً)
    // زي ما كان قبل التبويبات، فمفيش تحميل كسول لازم هنا
    function switchFinancialTab(name) {
      document.querySelectorAll('#financialTabs .tab').forEach(t => t.classList.remove('active'));
      const tabBtn = document.querySelector('#financialTabs .tab[data-tab="' + name + '"]');
      if (tabBtn) tabBtn.classList.add('active');
      document.querySelectorAll('#financialTabsWrap .tab-content').forEach(tc => tc.classList.remove('active'));
      const content = document.getElementById('tab-' + name);
      if (content) content.classList.add('active');
    }

    window.onload = function() {
      if (!isTokenValid()) {
        sessionStorage.clear(); localStorage.clear(); window.Capacitor?.Plugins?.Preferences?.clear().catch(() => {}); window.electronStore?.clear().catch(() => {});
        window.location.href = LOGIN_URL;
        return;
      }
      if (!isAssistant) {
        document.getElementById('navManageAssistants').style.display = 'flex';
        document.getElementById('navSettings').style.display = 'flex';
        document.getElementById('navResetSystem').style.display = 'flex';
        document.getElementById('navFinancial').style.display = 'flex';
        document.getElementById('navActivityLog').style.display = 'flex';
      } else {
        // ✅ Batch 21: القائمة الجانبية للمساعد لازم تعكس صلاحياته الفعلية في كل صفحة يزورها،
        // مش لوحة التحكم بس — نفس منطق التفعيل المستخدم في assistant-dashboard.html
        const navSt = document.getElementById('navStudents');
        const navGr = document.getElementById('navGroups');
        const navGd = document.getElementById('navGrades');
        const navPay = document.getElementById('navPayments');
        const navRep = document.getElementById('navReports');
        const navMsg = document.getElementById('navMessages');
        const navF = document.getElementById('navFinancial');
        const navL = document.getElementById('navActivityLog');
        const navA = document.getElementById('navManageAssistants');
        if (navSt) navSt.style.display = assistantPermissions.view_students !== false ? 'flex' : 'none';
        if (navGr) navGr.style.display = (assistantPermissions.manage_groups === true || assistantPermissions.manage_registration === true) ? 'flex' : 'none';
        if (navGd) navGd.style.display = assistantPermissions.record_grades === true ? 'flex' : 'none';
        if (navPay) navPay.style.display = assistantPermissions.record_payments === true ? 'flex' : 'none';
        if (navRep) navRep.style.display = assistantPermissions.view_reports === true ? 'flex' : 'none';
        if (navMsg) navMsg.style.display = (assistantPermissions.send_messages === true || assistantPermissions.manage_conversations === true) ? 'flex' : 'none';
        if (navF) navF.style.display = assistantPermissions.view_financial === true ? 'flex' : 'none';
        if (navL) navL.style.display = assistantPermissions.view_activity_log === true ? 'flex' : 'none';
        if (navA) navA.style.display = assistantPermissions.view_staff === true ? 'flex' : 'none';
      }
      populateFinancialMonths();
      loadFinancialSummary();
      document.getElementById('newExpenseDate').value = new Date().toISOString().split('T')[0];
    };
  </script>
